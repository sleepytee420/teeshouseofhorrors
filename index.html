<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tee's House of Horrors</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07040b;color:#f7e7ff;overflow:hidden;font-family:Georgia,'Times New Roman',serif}button{font:inherit;cursor:pointer}#stage{position:absolute;inset:0;overflow:hidden;background:#0b0612}#world{position:absolute;left:50%;top:50%;width:1672px;height:1024px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;overflow:hidden;perspective:1250px}#interior{position:absolute;inset:0;background:url('mansion.webp') center/100% 100%;filter:brightness(.67)}#interior:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse,transparent 34%,#0b0615a0 100%)}#facade{position:absolute;inset:0;background:url('facade.png') center/100% 100% no-repeat;pointer-events:none}#door{position:absolute;left:570px;top:245px;width:398px;height:779px;background:url('door.png') center/100% 100% no-repeat;transform-origin:98% 50%;transform-style:preserve-3d;backface-visibility:hidden;transition:transform 3.5s cubic-bezier(.22,.03,.16,1),filter 3.5s;filter:drop-shadow(-7px 1px 8px #0008)}.opening #door{transform:rotateY(-83deg);filter:brightness(.45) drop-shadow(-18px 3px 16px #000b)}#knock{position:absolute;left:603px;top:835px;width:332px;height:87px;border:1px solid #b68dd7;border-radius:60px;background:linear-gradient(135deg,#1c0d28,#3d1b53 52%,#180b23);box-shadow:0 0 28px #a25cdeaa,inset 0 0 22px #a16bd9;color:#fff;font-size:43px;letter-spacing:.1em;text-shadow:0 0 18px #e2bcff;transition:opacity .35s,transform .3s}#knock:hover{transform:scale(1.04);filter:brightness(1.25)}.opening #knock{opacity:0;pointer-events:none}#fog{position:absolute;inset:auto -15% -10% -15%;height:36%;background:radial-gradient(ellipse at 20% 70%,#aa88bb77,transparent 53%),radial-gradient(ellipse at 70% 85%,#8d6fa999,transparent 60%);filter:blur(33px);opacity:.28;pointer-events:none;animation:fogmove 7s ease-in-out infinite alternate}.opening #fog{opacity:.72}@keyframes fogmove{to{transform:translate(6%,-8%)}}#world.entering{animation:moveIn 2.4s ease-in forwards}@keyframes moveIn{to{transform:translate(-50%,-50%) scale(calc(var(--scale,1) * 1.55));opacity:.1}}#flash{position:absolute;inset:0;z-index:6;background:white;opacity:0;pointer-events:none}#flash.active{animation:flash .95s ease-out forwards}@keyframes flash{0%{opacity:0}22%{opacity:1}55%{opacity:.95}100%{opacity:0}}#nightmare{position:absolute;inset:0;z-index:5;background-position:center;background-size:cover;opacity:0;pointer-events:none;transition:opacity 1.3s;transform:scale(1.04)}#nightmare.visible{opacity:1;animation:slowZoom 14s ease-out forwards}@keyframes slowZoom{from{transform:scale(1.06)}to{transform:scale(1.16)}}#nightmare:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 38%,#07020aa6 100%)}#scare{position:absolute;inset:0;z-index:7;background-position:center;background-size:cover;opacity:0;pointer-events:none;filter:contrast(1.35) brightness(1.3)}#scare.active{animation:scare .7s ease-out forwards}@keyframes scare{0%{opacity:0;transform:scale(1)}20%{opacity:1;transform:scale(1.4)}55%{opacity:.9;transform:scale(1.9)}100%{opacity:0;transform:scale(2.3)}}#card{position:absolute;z-index:9;left:50%;top:50%;width:min(670px,84vw);padding:35px 42px 38px;text-align:center;transform:translate(-50%,-44%);background:linear-gradient(145deg,#1c1029f5,#09060ff7);border:1px solid #bd8ee0;border-radius:5px;box-shadow:0 0 0 7px #0d0619bb,0 0 0 8px #9262ac99,0 20px 90px #000e,inset 0 0 50px #54266a55;opacity:0;pointer-events:none;transition:opacity 1s,transform 1s}#card.show{opacity:1;transform:translate(-50%,-50%)}#card .eyebrow{font-size:12px;letter-spacing:.35em;color:#d2a7ee}#card h1{font-size:clamp(31px,4.5vw,59px);line-height:1.07;margin:22px 0 15px;text-shadow:0 0 22px #a760df;color:#f7eaff}#card .ornament{font-size:26px;color:#c398db;letter-spacing:.6em}#card p{font-size:19px;line-height:1.55;color:#e5d6ea}#card .reward{margin-top:24px;padding-top:22px;border-top:1px solid #80559a;color:#e8bbff;font-size:21px;font-weight:bold}#controls{position:fixed;z-index:15;right:14px;bottom:14px;display:flex;gap:7px;opacity:.24;transition:opacity .2s}#controls:hover,#controls:focus-within{opacity:1}#controls button{font:12px system-ui;background:#180f20ed;color:#ead6f5;border:1px solid #765a87;border-radius:6px;padding:9px 12px}#controls button:hover{background:#342143}#hint{position:fixed;bottom:14px;left:14px;z-index:15;color:#e5c7f0;opacity:0;font:12px system-ui;transition:opacity .5s}#hint.show{opacity:.7}@media(max-width:700px){#card{padding:24px;width:88vw}#card p{font-size:15px}#card .reward{font-size:17px}}
</style></head><body><main id="stage"><div id="world"><div id="interior"></div><div id="facade"></div><div id="door"></div><button id="knock" aria-label="Knock on the haunted door">KNOCK</button><div id="fog"></div></div><div id="nightmare"></div><div id="flash"></div><div id="scare"></div><section id="card" aria-live="polite"><div class="eyebrow">TEE'S HOUSE OF HORRORS</div><h1 id="prizeName"></h1><div class="ornament">✧ ⛧ ✧</div><p id="prizeDesc"></p><div class="reward" id="prizeReward"></div></section></main><div id="hint"></div><nav id="controls"><button id="sound">Sound: on</button><button id="skip">Skip animation</button><button id="reset">↺ Reset door</button><button id="full">⛶ Fullscreen</button></nav><script>
const prizes=[
{name:'GHOST HUNT',desc:"Don't look behind you... Something's following Tee, and now you've both been sent to investigate.",reward:'60 Minutes of Phasmophobia',art:'ghost',weight:88/7},
{name:'FINAL GIRL',desc:"Tee's been chosen as the next victim. Can you help her survive the night?",reward:'60 Minutes of Dead by Daylight',art:'forest',weight:88/7},
{name:'THE SUMMONING',desc:"Tee accidentally summoned something evil. Now you're both stuck dealing with it.",reward:'60 Minutes of DEVOUR',art:'ritual',weight:88/7},
{name:'CAUGHT ON CAMERA',desc:"Tee's been dared to film something terrifying. Hope you're ready to capture the evidence.",reward:'60 Minutes of Content Warning',art:'camera',weight:88/7},
{name:'ZOMBIE APOCALYPSE',desc:"The dead have taken over. Tee's counting on you to help her survive.",reward:'60 Minutes of World War Z',art:'zombie',weight:88/7},
{name:'NO WAY OUT',desc:"Tee took a wrong turn and ended up somewhere she shouldn't be. Now you're both trapped.",reward:'60 Minutes of Backrooms: Escape Together',art:'backrooms',weight:88/7},
{name:'NO HIDING!',desc:"Tee's been cursed to lead the way. No hiding behind you this time!",reward:'60 Minutes of Roblox Horror',art:'roblox',weight:88/7},
{name:'GRAVEYARD SHIFT',desc:"You've been invited to a private screening... but Tee has already chosen your nightmare.",reward:'One Full Horror Movie — Tee Chooses',art:'graveyard',weight:6},
{name:"DIRECTOR'S CUT",desc:"You've stolen the director's chair. Now YOU get to decide what nightmare Tee has to watch.",reward:'One Full Horror Movie — Client Chooses',art:'director',weight:6}];
const $=id=>document.getElementById(id),stage=$('stage'),world=$('world'),nightmare=$('nightmare');let chosen=null,busy=false,soundOn=true,ctx=null,timers=[];function later(fn,ms){timers.push(setTimeout(fn,ms))}function resize(){world.style.setProperty('--scale',Math.max(innerWidth/1672,innerHeight/1024))}addEventListener('resize',resize);resize();
function pick(){let r=Math.random()*100;for(const p of prizes){r-=p.weight;if(r<0)return p}return prizes[prizes.length-1]}
function audio(){if(!soundOn)return null;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}}
function thud(t=0){const a=audio();if(!a)return;let osc=a.createOscillator(),g=a.createGain(),now=a.currentTime+t;osc.type='sine';osc.frequency.setValueAtTime(105,now);osc.frequency.exponentialRampToValueAtTime(42,now+.19);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.25,now+.015);g.gain.exponentialRampToValueAtTime(.001,now+.3);osc.connect(g).connect(a.destination);osc.start(now);osc.stop(now+.31)}
function texturedSound(duration=2,vol=.12,startFreq=130,endFreq=45){const a=audio();if(!a)return;let len=Math.floor(a.sampleRate*duration),b=a.createBuffer(1,len,a.sampleRate),arr=b.getChannelData(0),smooth=0;for(let i=0;i<len;i++){smooth=smooth*.97+(Math.random()*2-1)*.03;arr[i]=smooth}let s=a.createBufferSource(),filter=a.createBiquadFilter(),gain=a.createGain();s.buffer=b;filter.type='lowpass';filter.frequency.setValueAtTime(startFreq,a.currentTime);filter.frequency.exponentialRampToValueAtTime(endFreq,a.currentTime+duration);gain.gain.setValueAtTime(.001,a.currentTime);gain.gain.linearRampToValueAtTime(vol,a.currentTime+duration*.3);gain.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);s.connect(filter).connect(gain).connect(a.destination);s.start();s.stop(a.currentTime+duration)}
function sting(){const a=audio();if(!a)return;texturedSound(1.3,.35,1900,130);[56,59,63].forEach((f,i)=>{let o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type='sawtooth';o.frequency.value=f+i*9;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.045,t+.07);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g).connect(a.destination);o.start(t);o.stop(t+1)})}
function flash(){const el=$('flash');el.classList.remove('active');void el.offsetWidth;el.classList.add('active')}
function showScene(){nightmare.style.backgroundImage=`url('${chosen.art}.webp')`;nightmare.classList.add('visible');flash();later(()=>{const scare=$('scare');scare.style.backgroundImage=`url('${chosen.art}.webp')`;scare.classList.add('active');sting()},1600);later(()=>{$('prizeName').textContent=chosen.name;$('prizeDesc').textContent=chosen.desc;$('prizeReward').textContent=chosen.reward;$('card').classList.add('show')},3100)}
function knock(){if(busy)return;busy=true;chosen=pick();$('knock').disabled=true;thud(0);thud(.3);later(()=>{world.classList.add('opening');texturedSound(3.5,.13,460,60)},900);later(()=>{world.classList.add('entering');texturedSound(2.4,.1,300,55)},4600);later(showScene,6800)}
function reset(){timers.forEach(clearTimeout);timers=[];busy=false;chosen=null;world.classList.remove('opening','entering');nightmare.classList.remove('visible');nightmare.style.backgroundImage='';$('scare').classList.remove('active');$('flash').classList.remove('active');$('card').classList.remove('show');$('knock').disabled=false;world.style.animation='none';void world.offsetWidth;world.style.animation=''}
$('knock').addEventListener('click',knock);$('reset').addEventListener('click',reset);$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=`Sound: ${soundOn?'on':'off'}`});$('skip').addEventListener('click',()=>{if(!busy||!chosen)return;timers.forEach(clearTimeout);timers=[];world.classList.add('opening','entering');showScene()});$('full').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
</script></body></html>
