<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tee's House of Horrors</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09050e;color:#eee2f7;font-family:Georgia,serif}button{cursor:pointer;font:inherit}#stage{position:absolute;inset:0;margin:auto;aspect-ratio:3/2;max-width:100vw;max-height:100vh;width:min(100vw,150vh);overflow:hidden;background:#08040e}#entrance{position:absolute;inset:0;background:url('entrance.png') center/100% 100% no-repeat;transition:transform 2s ease,opacity 1s ease}.void{position:absolute;left:35.8%;top:22.2%;width:28.8%;height:76%;background:radial-gradient(ellipse at center,#25132e 0%,#07030c 63%);clip-path:polygon(50% 0,92% 12%,100% 24%,100% 100%,0 100%,0 24%,8% 12%);opacity:0}.door{position:absolute;inset:0;background:url('entrance.png') center/100% 100% no-repeat;clip-path:polygon(49.7% 23%,55.5% 24%,60.6% 30%,63.4% 38%,63.4% 100%,36.4% 100%,36.4% 38%,39.1% 30%,44.4% 24%);transform-origin:36.4% 55%;backface-visibility:hidden;transition:transform 2.2s cubic-bezier(.3,.1,.2,1),filter 2s}.door.open{transform:perspective(900px) rotateY(-80deg);filter:brightness(.4)}#knock{position:absolute;left:40%;top:81%;width:20%;height:10%;border:1px solid #b78bdf;border-radius:60px;background:linear-gradient(130deg,#16091f,#3a1557,#14091c);box-shadow:0 0 25px #8d40c6,inset 0 0 15px #a86bd5;color:#fff;font-size:clamp(15px,2.3vw,34px);letter-spacing:.09em;text-shadow:0 0 10px #e0baff;transition:opacity .5s}#knock:hover{filter:brightness(1.3)}#knock:disabled{opacity:0;pointer-events:none}.fog{position:absolute;bottom:-8%;height:42%;width:120%;left:-10%;opacity:0;pointer-events:none;background:radial-gradient(ellipse at 35% 85%,#c9b0d47a,transparent 55%),radial-gradient(ellipse at 75% 90%,#7f659b99,transparent 57%);filter:blur(24px);animation:drift 6s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(7%) translateY(-8%)}}.entered #entrance{transform:scale(1.55);opacity:0}.entered .fog{opacity:1;transition:opacity 1.3s}.opening .void{opacity:1}.opening .fog{opacity:1;transition:opacity 1s}#scene{position:absolute;inset:0;display:none;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#38204b,#0a0710 65%)}#scene.show{display:block;animation:sceneIn 1.2s both}@keyframes sceneIn{from{filter:brightness(2);opacity:0}to{filter:brightness(1);opacity:1}}#scene:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 16%,#a48db011 16.1% 16.5%,transparent 17% 24%);opacity:.65}#scene:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse,transparent 15%,#000b 95%);pointer-events:none}.scene-art{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(90px,19vw,290px);filter:drop-shadow(0 0 35px #a56be5);animation:float 3s ease-in-out infinite alternate}.scene-art small{position:absolute;top:12%;font-size:clamp(16px,2vw,28px);letter-spacing:.3em;color:#cab5d7;text-shadow:0 0 12px #a477ca}@keyframes float{to{transform:translateY(-18px)}}#scene.forest{background:radial-gradient(ellipse at 50% 60%,#2c2439,#060b0d 75%)}#scene.ritual{background:radial-gradient(ellipse at 50% 75%,#6c237b,#110817 70%)}#scene.camera{background:repeating-linear-gradient(0deg,#171e23 0 4px,#0b1014 5px 8px)}#scene.zombie{background:radial-gradient(ellipse at 50% 70%,#3c4b49,#06090c 75%)}#scene.backrooms{background:linear-gradient(90deg,#332f20,#8b8050 30%,#393323 60%,#18170f)}#scene.roblox{background:radial-gradient(ellipse,#452253,#080611)}#scene.cinema{background:radial-gradient(ellipse at 50% 35%,#766b82,#110b18 50%,#020104)}#scare{position:absolute;inset:0;z-index:6;display:none;place-items:center;background:#000e;font-size:min(50vw,400px);filter:contrast(1.5)}#scare.blast{display:grid;animation:attack .75s both}@keyframes attack{0%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(1.8)}65%{transform:scale(2.8)}100%{opacity:0;transform:scale(4)}}#flash{position:absolute;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none}#flash.bang{animation:flash .9s both}@keyframes flash{0%,50%{opacity:1}100%{opacity:0}}#card{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-45%);width:min(78%,680px);padding:clamp(15px,3vw,38px);border:2px solid #a77ac7;background:linear-gradient(150deg,#170e21ed,#08060df2);box-shadow:0 0 45px #a260ba66,inset 0 0 30px #4b245f;border-radius:10px;text-align:center;opacity:0;pointer-events:none;transition:opacity 1s,transform 1s}#card.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}#card .eyebrow{letter-spacing:.18em;font-size:clamp(11px,1.4vw,18px);color:#c6a4e3}#card h1{font-size:clamp(26px,4.5vw,62px);margin:15px 0;color:#f2e6ff;text-shadow:0 0 20px #b27ae2}#card p{font-size:clamp(13px,1.9vw,23px);line-height:1.4}#card .reward{border-top:1px solid #80559a;margin-top:22px;padding-top:18px;color:#dfbdf6;font-weight:bold}#controls{position:fixed;z-index:20;right:12px;bottom:12px;display:flex;gap:8px;opacity:.65}#controls:hover{opacity:1}#controls button{background:#21152b;color:#eee;border:1px solid #86669e;border-radius:6px;padding:8px 12px;font:13px system-ui}#status{position:fixed;z-index:20;left:12px;bottom:12px;font:12px system-ui;color:#c3aacb88}@media(max-width:650px){#controls button{font-size:11px;padding:6px}#card{width:88%}}
</style></head><body><div id="stage"><div id="entrance"></div><div class="void"></div><div class="door" id="door"></div><div class="fog"></div><button id="knock">KNOCK</button><div id="scene"><div class="scene-art" id="sceneArt"></div></div><div id="scare"></div><div id="flash"></div><div id="card"><div class="eyebrow">TEE'S HOUSE OF HORRORS<br>YOUR NIGHTMARE AWAITS</div><h1 id="prizeName"></h1><p id="description"></p><p class="reward" id="reward"></p></div></div><div id="status">Host-controlled • 20 Buff per knock</div><div id="controls"><button id="sound">🔊 Sound on</button><button id="skip">Skip animation</button><button id="reset">↺ Reset door</button><button id="full">⛶ Fullscreen</button></div><script>
const prizes=[
{name:'🔦 GHOST HUNT',desc:"Don't look behind you... Something's following Tee, and now you've both been sent to investigate.",reward:'60 Minutes of Phasmophobia',icon:'👻',kind:'ghost',weight:88/7},
{name:'🔪 FINAL GIRL',desc:"Tee's been chosen as the next victim. Can you help her survive the night?",reward:'60 Minutes of Dead by Daylight',icon:'🔪',kind:'forest',weight:88/7},
{name:'😈 THE SUMMONING',desc:"Tee accidentally summoned something evil. Now you're both stuck dealing with it.",reward:'60 Minutes of DEVOUR',icon:'👹',kind:'ritual',weight:88/7},
{name:'📹 CAUGHT ON CAMERA',desc:"Tee's been dared to film something terrifying. Hope you're ready to capture the evidence.",reward:'60 Minutes of Content Warning',icon:'📹',kind:'camera',weight:88/7},
{name:'🧟 ZOMBIE APOCALYPSE',desc:"The dead have taken over. Tee's counting on you to help her survive.",reward:'60 Minutes of World War Z',icon:'🧟',kind:'zombie',weight:88/7},
{name:'🚪 NO WAY OUT',desc:"Tee took a wrong turn and ended up somewhere she shouldn't be. Now you're both trapped.",reward:'60 Minutes of Backrooms: Escape Together',icon:'👁️',kind:'backrooms',weight:88/7},
{name:'🕷️ NO HIDING!',desc:"Tee's been cursed to lead the way. No hiding behind you this time!",reward:'60 Minutes of Roblox Horror',icon:'🕷️',kind:'roblox',weight:88/7},
{name:'🪦 GRAVEYARD SHIFT',desc:"You've been invited to a private screening... but Tee has already chosen your nightmare.",reward:'One Full Horror Movie — Tee Chooses',icon:'🎞️',kind:'cinema',weight:6},
{name:"🍿 DIRECTOR'S CUT",desc:"You've stolen the director's chair. Now YOU get to decide what nightmare Tee has to watch.",reward:'One Full Horror Movie — Client Chooses',icon:'🎬',kind:'cinema',weight:6}];
const $=id=>document.getElementById(id),stage=$('stage');let busy=false,selected=null,timers=[],audio=null,soundOn=true;function later(fn,ms){timers.push(setTimeout(fn,ms))}function pick(){let n=Math.random()*100;for(const p of prizes){n-=p.weight;if(n<0)return p}return prizes[prizes.length-1]}function tone(freq=100,duration=.2,type='sawtooth',volume=.12){if(!soundOn)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(25,freq*.35),audio.currentTime+duration);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}function fill(p){$('scene').className=p.kind;$('sceneArt').innerHTML='<small>YOUR NIGHTMARE IS WAITING</small>'+p.icon;$('prizeName').textContent=p.name;$('description').textContent=p.desc;$('reward').textContent=p.reward;$('scare').textContent=p.icon}function showCard(){ $('card').classList.add('show')}function reveal(){stage.classList.add('entered');$('scene').classList.add('show');tone(220,.65,'triangle',.07);later(()=>{tone(850,.8,'sawtooth',.2);$('scare').classList.add('blast');later(()=>{$('scare').classList.remove('blast');showCard()},850)},1700)}function knock(){if(busy)return;busy=true;selected=pick();fill(selected);$('knock').disabled=true;tone(90,.15,'square',.16);later(()=>tone(65,.18,'square',.14),320);later(()=>{stage.classList.add('opening');$('door').classList.add('open');tone(72,1.8,'sawtooth',.09)},800);later(()=>stage.classList.add('entered'),2600);later(()=>{$('flash').classList.add('bang');tone(500,.25,'triangle',.13)},3700);later(reveal,4250)}function reset(){timers.forEach(clearTimeout);timers=[];busy=false;selected=null;stage.className='';$('door').className='door';$('scene').className='';$('scare').className='';$('flash').className='';$('card').className='';$('knock').disabled=false} $('knock').onclick=knock;$('reset').onclick=reset;$('skip').onclick=()=>{if(!busy||!selected)return;timers.forEach(clearTimeout);timers=[];stage.classList.add('entered');$('scene').classList.add('show');$('flash').className='';$('scare').className='';showCard()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound on':'🔇 Sound off'};$('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
</script></body></html>
