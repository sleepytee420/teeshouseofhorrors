<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tee's House of Horrors</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07040b;color:#f7e7ff;overflow:hidden;font-family:Georgia,'Times New Roman',serif}button{font:inherit;cursor:pointer}#stage{position:absolute;inset:0;overflow:hidden;background:#07040b}#stage:before{content:'';position:absolute;inset:-40px;background:url('entrance-video-frame.png') center/cover no-repeat;filter:blur(45px) brightness(.25);pointer-events:none}#stillEntrance{position:absolute;inset:0;z-index:3;background:url('entrance-video-frame.png') center center/contain no-repeat;pointer-events:none}#stillEntrance.hidden{display:none}#knockOverlay{position:absolute;z-index:5;left:50%;top:50%;width:min(100vw,calc(100vh * 3 / 2));height:min(100vh,calc(100vw * 2 / 3));transform:translate(-50%,-50%);pointer-events:none}#knockOverlay button{position:absolute;left:36%;top:78%;width:28%;height:14%;background:transparent;border:0;color:transparent;cursor:pointer;pointer-events:auto}#knockOverlay button:focus-visible{outline:3px solid #dcb7f4;border-radius:14px}#knockOverlay.hidden{display:none}#world{position:absolute;left:50%;top:50%;width:1672px;height:1024px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;overflow:hidden;perspective:1250px}#interior{position:absolute;inset:0;background:url('mansion.webp') center/100% 100%;filter:brightness(.67)}#interior:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse,transparent 34%,#0b0615a0 100%)}#facade{position:absolute;inset:0;background:url('facade.png') center/100% 100% no-repeat;pointer-events:none}#door{position:absolute;left:570px;top:245px;width:398px;height:779px;background:url('door.png') center/100% 100% no-repeat;transform-origin:98% 50%;transform-style:preserve-3d;backface-visibility:hidden;transition:transform 3.5s cubic-bezier(.22,.03,.16,1),filter 3.5s;filter:drop-shadow(-7px 1px 8px #0008)}.opening #door{transform:rotateY(-83deg);filter:brightness(.45) drop-shadow(-18px 3px 16px #000b)}#closed /* Ghost cursor with a soft, fading purple trail (desktop only). */

  #ghostPointer { position:fixed; z-index:99999; width:32px; height:32px;

</style></head><body><main id="stage"><div id="world" style="display:none"><div id="interior"></div><div id="facade"></div><div id="door"></div><div id="closedEntrance"></div><button id="knock" aria-label="Knock on the haunted door">KNOCK</button><div id="fog"></div></div><div id="stillEntrance"></div><div id="atmosphere" aria-hidden="true"><div class="lantern left"></div><div class="lantern right"></div><div class="mist"></div><div class="shade"></div></div><div id="knockOverlay"><button id="knockNew" aria-label="Knock on the haunted door"></button></div><audio id="knockFx" preload="auto" src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Door_knocker_audio.ogg"></audio><audio id="creakFx" preload="auto" src="door-creak-real.mp3"></audio><audio id="ambienceFx" preload="auto" src="nightmare-atmosphere.mp3"></audio><audio id="organFx" preload="auto" src="church-organ.mp3"></audio><audio id="impactFx" preload="auto" src="reveal-impact.mp3"></audio><video id="cinematic" preload="auto" playsinline poster="entrance-video-frame.png" src="door-opening.mp4"></video><div id="nightmare"></div><div id="flash"></div><div id="scare"></div><section id="card" aria-live="polite"><div class="eyebrow">TEE'S HOUSE OF HORRORS</div><h1 id="prizeName"></h1><div class="ornament">✧ ⛧ ✧</div><p id="prizeDesc"></p><div class="reward" id="prizeReward"></div></section></main><div id="hint"></div><nav id="controls"><button id="sound" aria-pressed="true">Sound: on</button><label class="volumeGroup" for="volume">Volume <input id="volume" type="range" min="0" max="100" value="65" aria-label="Sound volume"><span id="volumeValue">65%</span></label><button id="again" disabled>↻ Knock again</button><button id="skip">Skip animation</button><button id="reset">↺ Reset door</button><button id="full">⛶ Fullscreen</button></nav><script>
const prizes=[
{name:'GHOST HUNT',desc:"Don't look behind you... Something's following Tee, and now you've both been sent to investigate.",reward:'60 Minutes of Phasmophobia',art:'ghost',weight:10},
{name:'FINAL GIRL',desc:"Tee's been chosen as the next victim. Can you help her survive the night?",reward:'60 Minutes of Dead by Daylight',art:'forest',weight:10},
{name:'THE SUMMONING',desc:"Tee accidentally summoned something evil. Now you're both stuck dealing with it.",reward:'60 Minutes of DEVOUR',art:'ritual',weight:10},
{name:'CAUGHT ON CAMERA',desc:"Tee's been dared to film something terrifying. Hope you're ready to capture the evidence.",reward:'60 Minutes of Content Warning',art:'camera',weight:10},
{name:'ZOMBIE APOCALYPSE',desc:"The dead have taken over. Tee's counting on you to help her survive.",reward:'60 Minutes of World War Z',art:'zombie',weight:10},
{name:'NO WAY OUT',desc:"Tee took a wrong turn and ended up somewhere she shouldn't be. Now you're both trapped.",reward:'60 Minutes of Backrooms: Escape Together',art:'backrooms',weight:10},
{name:'NO HIDING!',desc:"Tee's been cursed to lead the way. No hiding behind you this time!",reward:'60 Minutes of Roblox Horror',art:'roblox',weight:10},
{name:'GRAVEYARD SHIFT',desc:"You've been invited to a private screening... but Tee has already chosen your nightmare.",reward:'One Full Horror Movie — Tee Chooses',art:'graveyard',weight:15},
{name:"DIRECTOR'S CUT",desc:"You've stolen the director's chair. Now YOU get to decide what nightmare Tee has to watch.",reward:'One Full Horror Movie — Client Chooses',art:'director',weight:15}];
const $=id=>document.getElementById(id),stage=$('stage'),world=$('world'),nightmare=$('nightmare');let chosen=null,busy=false,soundOn=true,masterVolume=.65,ctx=null,timers=[];function later(fn,ms){timers.push(setTimeout(fn,ms))}function resize(){world.style.setProperty('--scale',Math.min(innerWidth/1672,innerHeight/1024))}addEventListener('resize',resize);resize();
function pick(){let total=prizes.reduce((sum,p)=>sum+p.weight,0),r=Math.random()*total;for(const p of prizes){r-=p.weight;if(r<0)return p}return prizes[prizes.length-1]}
function updateCounter(){$('again').disabled=!busy||!chosen}
updateCounter();
function audio(){if(!soundOn)return null;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}}
function thud(t=0){const a=audio();if(!a)return;let osc=a.createOscillator(),g=a.createGain(),now=a.currentTime+t;osc.type='sine';osc.frequency.setValueAtTime(105,now);osc.frequency.exponentialRampToValueAtTime(42,now+.19);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.25,now+.015);g.gain.exponentialRampToValueAtTime(.001,now+.3);osc.connect(g).connect(a.destination);osc.start(now);osc.stop(now+.31)}
function texturedSound(duration=2,vol=.12,startFreq=130,endFreq=45){const a=audio();if(!a)return;let len=Math.floor(a.sampleRate*duration),b=a.createBuffer(1,len,a.sampleRate),arr=b.getChannelData(0),smooth=0;for(let i=0;i<len;i++){smooth=smooth*.97+(Math.random()*2-1)*.03;arr[i]=smooth}let s=a.createBufferSource(),filter=a.createBiquadFilter(),gain=a.createGain();s.buffer=b;filter.type='lowpass';filter.frequency.setValueAtTime(startFreq,a.currentTime);filter.frequency.exponentialRampToValueAtTime(endFreq,a.currentTime+duration);gain.gain.setValueAtTime(.001,a.currentTime);gain.gain.linearRampToValueAtTime(vol,a.currentTime+duration*.3);gain.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);s.connect(filter).connect(gain).connect(a.destination);s.start();s.stop(a.currentTime+duration)}
function sting(){const a=audio();if(!a)return;texturedSound(1.3,.35,1900,130);[56,59,63].forEach((f,i)=>{let o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type='sawtooth';o.frequency.value=f+i*9;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.045,t+.07);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g).connect(a.destination);o.start(t);o.stop(t+1)})}
function flash(){const el=$('flash');el.classList.remove('active');void el.offsetWidth;el.classList.add('active')}
function showScene(){nightmare.style.backgroundImage=`url('${chosen.art}.webp')`;nightmare.classList.add('visible');flash();later(()=>{const scare=$('scare');scare.style.backgroundImage=`url('${chosen.art}.webp')`;scare.classList.add('active');playFx('impactFx',.8)},1600);later(()=>{$('prizeName').textContent=chosen.name;$('prizeDesc').textContent=chosen.desc;$('prizeReward').textContent=chosen.reward;$('card').classList.add('show')},3100)}
const cinematic=$('cinematic');
function finishCinematic(){if(!busy||!chosen||nightmare.classList.contains('visible'))return;showScene();later(()=>{cinematic.pause();cinematic.classList.remove('playing')},600)}
cinematic.addEventListener('ended',finishCinematic);
cinematic.addEventListener('error',()=>{if(busy)finishCinematic()});
function playFx(id,vol){if(!soundOn)return;const a=$(id);a.pause();a.currentTime=0;a.volume=Math.min(1,vol*masterVolume);a.dataset.baseVolume=vol;a.play().catch(()=>{});}
function stopFx(){['knockFx','creakFx','ambienceFx','organFx','impactFx'].forEach(id=>{const a=$(id);a.pause();a.currentTime=0})}
function beginMovie(){if(!busy||!chosen)return;cinematic.currentTime=0;cinematic.muted=true;cinematic.classList.add('playing');$('stillEntrance').classList.add('hidden');$('atmosphere').classList.add('hidden');$('knockOverlay').classList.add('hidden');const play=cinematic.play();if(play&&play.catch)play.catch(()=>finishCinematic());later(finishCinematic,10000)}
function knock(){if(busy)return;chosen=pick();busy=true;updateCounter();$('knock').disabled=true;$('knockNew').disabled=true;
// Browsers permit playback after this user click. The CC0 metal door knocker recording contains three knocks; play it once before the video.
$('organFx').pause();
playFx('knockFx',.95);
later(()=>{playFx('creakFx',.9);playFx('ambienceFx',.34);beginMovie()},1650)}
function resetEntrance(){stopFx();timers.forEach(clearTimeout);timers=[];busy=false;chosen=null;world.classList.remove('opening','entering');cinematic.pause();cinematic.currentTime=0;cinematic.classList.remove('playing');nightmare.classList.remove('visible');nightmare.style.backgroundImage='';$('scare').classList.remove('active');$('flash').classList.remove('active');$('card').classList.remove('show');$('knock').disabled=false;$('knockNew').disabled=false;$('stillEntrance').classList.remove('hidden');$('atmosphere').classList.remove('hidden');$('knockOverlay').classList.remove('hidden');world.style.animation='none';void world.offsetWidth;world.style.animation='';updateCounter();if(soundOn)playFx('organFx',.22)}
function resetAll(){resetEntrance()}
$('knock').addEventListener('click',knock);$('knockNew').addEventListener('click',knock);$('again').addEventListener('click',()=>{if(!busy)return;resetEntrance()});$('reset').addEventListener('click',resetAll);$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=`Sound: ${soundOn?'on':'off'}`;$('sound').setAttribute('aria-pressed',String(soundOn));cinematic.muted=true;if(!soundOn)stopFx();else if(!busy)playFx('organFx',.22)});$('volume').addEventListener('input',e=>{masterVolume=Number(e.target.value)/100;$('volumeValue').textContent=`${e.target.value}%`;['knockFx','creakFx','ambienceFx','organFx','impactFx'].forEach(id=>{const a=$(id);if(a.dataset.baseVolume)a.volume=Math.min(1,Number(a.dataset.baseVolume)*masterVolume)})});$('skip').addEventListener('click',()=>{if(!busy||!chosen)return;timers.forEach(clearTimeout);timers=[];cinematic.pause();cinematic.classList.remove('playing');stopFx();showScene()});$('full').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});

<script>
(() => {
  if (!window.matchMedia('(pointer:fine)').matches) return;
  const cursor = document.createElement('div');
  cursor.id = 'ghostPointer';
  cursor.setAttribute('aria-hidden','true');
  const canvas = document.createElement('canvas');
  canvas.id = 'ghostTrail';
  canvas.setAttribute('aria-hidden','true');
  document.body.append(canvas,cursor);
  const ctx = canvas.getContext('2d');
  let wisps=[], lastX=null,lastY=null;
  function resizeTrail() {
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resizeTrail();addEventListener('resize',resizeTrail);
  document.addEventListener('pointermove', e => {
    if(e.pointerType==='touch')return;
    cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';cursor.style.opacity='1';
    cursor.classList.toggle('hovering',!!e.target.closest('button,input,a,[role=button]'));
    const x=e.clientX,y=e.clientY;
    if(lastX!==null){
      const dist=Math.hypot(x-lastX,y-lastY);
      const steps=Math.min(12,Math.max(1,Math.ceil(dist/5)));
      for(let i=0;i<steps;i++){
        const t=(i+1)/steps;
        wisps.push({x:lastX+(x-lastX)*t+3,y:lastY+(y-lastY)*t+5,
          vx:(Math.random()-.5)*.55,vy:-.22-Math.random()*.28,
          age:0,ttl:28+Math.random()*18,rad:3+Math.random()*2});
      }
    }
    lastX=x;lastY=y;
    if(wisps.length>160)wisps.splice(0,wisps.length-160);
  },{passive:true});
  document.addEventListener('pointerout',e=>{
    if(!e.relatedTarget){cursor.style.opacity='0';lastX=null;lastY=null;}
  });
  function frame(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ctx.globalCompositeOperation='screen';
    wisps=wisps.filter(p=>p.age<p.ttl);
    for(const p of wisps){
      const fade=Math.pow(1-p.age/p.ttl,1.6);
      const radius=p.rad*(1+p.age*.12);
      const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius*3);
      grad.addColorStop(0,`rgba(194,132,255,${fade*.16})`);
      grad.addColorStop(.42,`rgba(133,69,200,${fade*.085})`);
      grad.addColorStop(1,'rgba(83,34,145,0)');
      ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(p.x,p.y,radius*3,radius*1.5,-.3,0,Math.PI*2);ctx.fill();
      p.x+=p.vx+Math.sin(p.age*.14)*.22;p.y+=p.vy;p.age++;
    }
    ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
