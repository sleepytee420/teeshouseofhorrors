<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tee's House of Horrors</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09050e;color:#eee2f7;font-family:Georgia,serif}button{cursor:pointer;font:inherit}#stage{position:absolute;inset:0;margin:auto;aspect-ratio:3/2;max-width:100vw;max-height:100vh;width:min(100vw,150vh);overflow:hidden;background:#08040e}#entrance{position:absolute;inset:0;background:url('entrance.png') center/100% 100% no-repeat;transition:transform 2s ease,opacity 1s ease}.void{position:absolute;left:35.8%;top:22.2%;width:28.8%;height:76%;background:radial-gradient(ellipse at center,#25132e 0%,#07030c 63%);clip-path:polygon(50% 0,92% 12%,100% 24%,100% 100%,0 100%,0 24%,8% 12%);opacity:0}.door{position:absolute;inset:0;background:url('entrance.png') center/100% 100% no-repeat;clip-path:polygon(49.7% 23%,55.5% 24%,60.6% 30%,63.4% 38%,63.4% 100%,36.4% 100%,36.4% 38%,39.1% 30%,44.4% 24%);transform-origin:63.4% 55%;backface-visibility:hidden;transition:transform 2.2s cubic-bezier(.3,.1,.2,1),filter 2s}.door:after{content:"";position:absolute;left:39%;top:80%;width:23%;height:14%;background:linear-gradient(#100a16,#180d20);opacity:.92;filter:blur(8px)}.door.open{transform:perspective(900px) rotateY(78deg);filter:brightness(.4)}#knock{position:absolute;left:40%;top:81%;width:20%;height:10%;border:1px solid #b78bdf;border-radius:60px;background:linear-gradient(130deg,#16091f,#3a1557,#14091c);box-shadow:0 0 25px #8d40c6,inset 0 0 15px #a86bd5;color:#fff;font-size:clamp(15px,2.3vw,34px);letter-spacing:.09em;text-shadow:0 0 10px #e0baff;transition:opacity .5s}#knock:hover{filter:brightness(1.3)}#knock:disabled{opacity:0;pointer-events:none}.fog{position:absolute;bottom:-8%;height:42%;width:120%;left:-10%;opacity:0;pointer-events:none;background:radial-gradient(ellipse at 35% 85%,#c9b0d47a,transparent 55%),radial-gradient(ellipse at 75% 90%,#7f659b99,transparent 57%);filter:blur(24px);animation:drift 6s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(7%) translateY(-8%)}}.entered #entrance{transform:scale(1.55);opacity:0}.entered .fog{opacity:1;transition:opacity 1.3s}.opening .void{opacity:1}.opening .fog{opacity:1;transition:opacity 1s}#scene{position:absolute;inset:0;display:none;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#38204b,#0a0710 65%)}#scene.show{display:block;animation:sceneIn 1.2s both}@keyframes sceneIn{from{filter:brightness(2);opacity:0}to{filter:brightness(1);opacity:1}}#scene:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 16%,#a48db011 16.1% 16.5%,transparent 17% 24%);opacity:.65}#scene:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse,transparent 15%,#000b 95%);pointer-events:none}.scene-art{position:absolute;inset:0;display:grid;place-items:center;animation:float 4s ease-in-out infinite alternate}.scene-art svg{width:min(65%,570px);height:80%;filter:drop-shadow(0 0 28px #b58bc477)}.scene-art small{position:absolute;top:12%;font-size:clamp(16px,2vw,28px);letter-spacing:.3em;color:#cab5d7;text-shadow:0 0 12px #a477ca}@keyframes float{to{transform:translateY(-18px)}}#scene.forest{background:radial-gradient(ellipse at 50% 60%,#2c2439,#060b0d 75%)}#scene.ritual{background:radial-gradient(ellipse at 50% 75%,#6c237b,#110817 70%)}#scene.camera{background:repeating-linear-gradient(0deg,#171e23 0 4px,#0b1014 5px 8px)}#scene.zombie{background:radial-gradient(ellipse at 50% 70%,#3c4b49,#06090c 75%)}#scene.backrooms{background:linear-gradient(90deg,#332f20,#8b8050 30%,#393323 60%,#18170f)}#scene.roblox{background:radial-gradient(ellipse,#452253,#080611)}#scene.cinema{background:radial-gradient(ellipse at 50% 35%,#766b82,#110b18 50%,#020104)}#scare{position:absolute;inset:0;z-index:6;display:none;place-items:center;background:#000e;font-size:min(50vw,400px);filter:contrast(1.5)}#scare.blast{display:grid;animation:attack .75s both}#scare svg{width:min(85vw,850px);height:90vh;filter:drop-shadow(0 0 40px #bba4c4)}@keyframes attack{0%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(1.8)}65%{transform:scale(2.8)}100%{opacity:0;transform:scale(4)}}#flash{position:absolute;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none}#flash.bang{animation:flash .9s both}@keyframes flash{0%,50%{opacity:1}100%{opacity:0}}#card{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-45%);width:min(78%,680px);padding:clamp(15px,3vw,38px);border:2px solid #a77ac7;background:linear-gradient(150deg,#170e21ed,#08060df2);box-shadow:0 0 45px #a260ba66,inset 0 0 30px #4b245f;border-radius:10px;text-align:center;opacity:0;pointer-events:none;transition:opacity 1s,transform 1s}#card.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}#card .eyebrow{letter-spacing:.18em;font-size:clamp(11px,1.4vw,18px);color:#c6a4e3}#card h1{font-size:clamp(26px,4.5vw,62px);margin:15px 0;color:#f2e6ff;text-shadow:0 0 20px #b27ae2}#card p{font-size:clamp(13px,1.9vw,23px);line-height:1.4}#card .reward{border-top:1px solid #80559a;margin-top:22px;padding-top:18px;color:#dfbdf6;font-weight:bold}#controls{position:fixed;z-index:20;right:12px;bottom:12px;display:flex;gap:8px;opacity:.65}#controls:hover{opacity:1}#controls button{background:#21152b;color:#eee;border:1px solid #86669e;border-radius:6px;padding:8px 12px;font:13px system-ui}#status{position:fixed;z-index:20;left:12px;bottom:12px;font:12px system-ui;color:#c3aacb88}@media(max-width:650px){#controls button{font-size:11px;padding:6px}#card{width:88%}}
</style></head><body><div id="stage"><div id="entrance"></div><div class="void"></div><div class="door" id="door"></div><div class="fog"></div><button id="knock">KNOCK</button><div id="scene"><div class="scene-art" id="sceneArt"></div></div><div id="scare"></div><div id="flash"></div><div id="card"><div class="eyebrow">TEE'S HOUSE OF HORRORS<br>YOUR NIGHTMARE AWAITS</div><h1 id="prizeName"></h1><p id="description"></p><p class="reward" id="reward"></p></div></div><div id="status">Host-controlled • 20 Buff per knock</div><div id="controls"><button id="sound">🔊 Sound on</button><button id="skip">Skip animation</button><button id="reset">↺ Reset door</button><button id="full">⛶ Fullscreen</button></div><script>
const prizes=[
{name:'GHOST HUNT',desc:"Don't look behind you... Something's following Tee, and now you've both been sent to investigate.",reward:'60 Minutes of Phasmophobia',icon:'👻',kind:'ghost',weight:88/7},
{name:'FINAL GIRL',desc:"Tee's been chosen as the next victim. Can you help her survive the night?",reward:'60 Minutes of Dead by Daylight',icon:'🔪',kind:'forest',weight:88/7},
{name:'THE SUMMONING',desc:"Tee accidentally summoned something evil. Now you're both stuck dealing with it.",reward:'60 Minutes of DEVOUR',icon:'👹',kind:'ritual',weight:88/7},
{name:'CAUGHT ON CAMERA',desc:"Tee's been dared to film something terrifying. Hope you're ready to capture the evidence.",reward:'60 Minutes of Content Warning',icon:'📹',kind:'camera',weight:88/7},
{name:'ZOMBIE APOCALYPSE',desc:"The dead have taken over. Tee's counting on you to help her survive.",reward:'60 Minutes of World War Z',icon:'🧟',kind:'zombie',weight:88/7},
{name:'NO WAY OUT',desc:"Tee took a wrong turn and ended up somewhere she shouldn't be. Now you're both trapped.",reward:'60 Minutes of Backrooms: Escape Together',icon:'👁️',kind:'backrooms',weight:88/7},
{name:'NO HIDING!',desc:"Tee's been cursed to lead the way. No hiding behind you this time!",reward:'60 Minutes of Roblox Horror',icon:'🕷️',kind:'roblox',weight:88/7},
{name:'GRAVEYARD SHIFT',desc:"You've been invited to a private screening... but Tee has already chosen your nightmare.",reward:'One Full Horror Movie — Tee Chooses',icon:'🎞️',kind:'cinema',weight:6},
{name:"DIRECTOR'S CUT",desc:"You've stolen the director's chair. Now YOU get to decide what nightmare Tee has to watch.",reward:'One Full Horror Movie — Client Chooses',icon:'🎬',kind:'cinema',weight:6}];
const $=id=>document.getElementById(id),stage=$('stage');let busy=false,selected=null,timers=[],audio=null,soundOn=true;function later(fn,ms){timers.push(setTimeout(fn,ms))}function pick(){let n=Math.random()*100;for(const p of prizes){n-=p.weight;if(n<0)return p}return prizes[prizes.length-1]}function noise(duration=0.4,volume=0.06,low=180){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const len=Math.ceil(audio.sampleRate*duration),buf=audio.createBuffer(1,len,audio.sampleRate),data=buf.getChannelData(0);let prev=0;for(let i=0;i<len;i++){prev=(prev+(Math.random()*2-1)*0.09)*0.98;data[i]=prev}const src=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();src.buffer=buf;f.type='lowpass';f.frequency.value=low;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);src.connect(f).connect(g).connect(audio.destination);src.start()}catch(e){}}
function tone(freq=100,duration=.2,type='sawtooth',volume=.12){noise(duration,volume*1.3,freq)}
function nightmareArt(kind){
 const head=`<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><radialGradient id="shade"><stop stop-color="#715078"/><stop offset="1" stop-color="#0b0710"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="8"/></filter></defs>`;
 const ghost=`<path d="M250 65 C150 65 135 155 135 290 L105 500 165 470 205 525 250 472 300 530 343 465 400 500 365 270 C355 140 345 65 250 65Z" fill="url(#shade)" stroke="#aa8aa9" stroke-width="3"/><ellipse cx="204" cy="258" rx="20" ry="42" fill="#050209"/><ellipse cx="294" cy="258" rx="20" ry="42" fill="#050209"/><ellipse cx="250" cy="352" rx="15" ry="35" fill="#08050a"/>`;
 const killer=`<path d="M190 205 Q170 95 250 80 Q330 95 310 205 L350 300 400 580 95 580 145 300Z" fill="#07060b" stroke="#57415d" stroke-width="6"/><path d="M207 130 Q250 95 292 130 L292 252 Q250 305 207 252Z" fill="#a49ba3"/><path d="M215 195 L245 215 216 219 M285 195 L255 215 284 219" stroke="#100810" stroke-width="13"/><path d="M240 260 L275 255" stroke="#241827" stroke-width="9"/><path d="M365 315 L420 500 380 540 333 350" fill="#100b12"/><path d="M416 475 L445 580" stroke="#c2b7c4" stroke-width="18"/>`;
 const demon=`<path d="M150 170 L90 30 210 110 Q250 50 290 110 L410 30 350 170 Q400 260 340 370 L400 580 100 580 160 370 Q100 260 150 170Z" fill="#09040e" stroke="#6c3d83" stroke-width="6"/><path d="M167 260 Q210 232 232 275 Q195 294 167 260 M268 275 Q290 232 333 260 Q305 294 268 275" fill="#e5c7fa"/><path d="M217 340 L280 340 250 400Z" fill="#130719" stroke="#7d568b" stroke-width="4"/>`;
 const zombie=`<path d="M185 195 Q160 75 250 85 Q340 75 320 195 L360 280 400 580 100 580 140 280Z" fill="#141d1b" stroke="#56635c" stroke-width="7"/><path d="M195 140 Q250 100 305 140 L298 250 255 290 195 245Z" fill="#768478"/><ellipse cx="215" cy="200" rx="23" ry="14" fill="#10140f"/><ellipse cx="283" cy="200" rx="23" ry="14" fill="#10140f"/><path d="M210 257 L286 250" stroke="#201d19" stroke-width="13" stroke-dasharray="9 7"/>`;
 const hallway=`<path d="M0 0 L185 150 185 450 0 600 M500 0 L315 150 315 450 500 600" fill="#5d563a" stroke="#a5a17e" stroke-width="6"/><path d="M185 150 H315 V450 H185Z" fill="#16150e"/><path d="M0 0 L185 150 H315 L500 0 M0 600 L185 450 H315 L500 600" fill="#36301f"/><path d="M235 270 Q250 230 265 270 L277 385 H222Z" fill="#080809"/>`;
 const camera=`<rect x="45" y="70" width="410" height="460" rx="12" fill="#0a1115" stroke="#6c8282" stroke-width="15"/><path d="M140 460 Q110 240 250 180 Q390 240 360 460Z" fill="#101016"/><ellipse cx="205" cy="285" rx="18" ry="29" fill="#d2d5cb"/><ellipse cx="300" cy="285" rx="18" ry="29" fill="#d2d5cb"/><path d="M215 390 Q250 445 285 390" stroke="#b1b7a8" stroke-width="11" fill="none"/><path d="M75 130 H425 M75 390 H425" stroke="#9db4ad" stroke-opacity=".2" stroke-width="10"/>`;
 const cinema=`<path d="M30 90 H470 V410 H30Z" fill="#07070c" stroke="#746082" stroke-width="15"/><path d="M55 115 H445 V385 H55Z" fill="url(#shade)"/><path d="M250 180 Q180 210 205 310 L295 310 Q320 210 250 180Z" fill="#100b14"/><ellipse cx="225" cy="260" rx="10" ry="18" fill="#b4a5bb"/><ellipse cx="275" cy="260" rx="10" ry="18" fill="#b4a5bb"/><path d="M0 600 Q100 450 200 600 Q300 450 400 600 L500 600" fill="#130c1b"/>`;
 const art=({ghost,forest:killer,ritual:demon,camera,zombie,backrooms:hallway,roblox:demon,cinema})[kind]||ghost;
 return head+art+'</svg>';
}
function fill(p){$('scene').className=p.kind;$('sceneArt').innerHTML=nightmareArt(p.kind);$('prizeName').textContent=p.name;$('description').textContent=p.desc;$('reward').textContent=p.reward;$('scare').innerHTML=nightmareArt(p.kind)}function showCard(){ $('card').classList.add('show')}function reveal(){stage.classList.add('entered');$('scene').classList.add('show');tone(220,.65,'triangle',.07);later(()=>{tone(850,.8,'sawtooth',.2);$('scare').classList.add('blast');later(()=>{$('scare').classList.remove('blast');showCard()},850)},1700)}function knock(){if(busy)return;busy=true;selected=pick();fill(selected);$('knock').disabled=true;tone(90,.15,'square',.16);later(()=>tone(65,.18,'square',.14),320);later(()=>{stage.classList.add('opening');$('door').classList.add('open');tone(72,1.8,'sawtooth',.09)},800);later(()=>stage.classList.add('entered'),2600);later(()=>{$('flash').classList.add('bang');tone(500,.25,'triangle',.13)},3700);later(reveal,4250)}function reset(){timers.forEach(clearTimeout);timers=[];busy=false;selected=null;stage.className='';$('door').className='door';$('scene').className='';$('scare').className='';$('flash').className='';$('card').className='';$('knock').disabled=false} $('knock').onclick=knock;$('reset').onclick=reset;$('skip').onclick=()=>{if(!busy||!selected)return;timers.forEach(clearTimeout);timers=[];stage.classList.add('entered');$('scene').classList.add('show');$('flash').className='';$('scare').className='';showCard()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound on':'🔇 Sound off'};$('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
</script></body></html>
